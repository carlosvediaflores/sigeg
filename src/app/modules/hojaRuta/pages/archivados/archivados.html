<div class="p-4">

    <!-- Título -->
    <div class="flex items-center gap-2 mb-6">
        <h1 class="text-2xl font-semibold text-slate-100">
            Hojas de Ruta - Archivos
        </h1>

        <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" class="w-7 h-7 text-slate-100">
            <path
                d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2Zm-2 4H7V5h10v2Zm0 4H7V9h10v2Zm0 4H7v-2h10v2Z" />
        </svg>
    </div>


    <!-- TARJETAS -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">

        @for (archivo of archivadosResource.value()?.archivados ?? []; track archivo._id) {

        <div class="bg-cyan-900 border border-slate-200 rounded-lg
               shadow-sm hover:shadow-md transition-shadow
               min-h-82.5 flex flex-col items-center justify-center
               text-center p-6">

            <!-- Icono archivador -->
            <div class="mb-5">

                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
                    class="w-20 h-20 text-amber-500">
                    <path
                        d="M3.375 3C2.339 3 1.5 3.84 1.5 4.875v.75c0 1.036.84 1.875 1.875 1.875h17.25c1.035 0 1.875-.84 1.875-1.875v-.75C22.5 3.839 21.66 3 20.625 3H3.375Z" />
                    <path fill-rule="evenodd"
                        d="m3.087 9 .54 9.176A3 3 0 0 0 6.62 21h10.757a3 3 0 0 0 2.995-2.824L20.913 9H3.087Zm6.163 3.75A.75.75 0 0 1 10 12h4a.75.75 0 0 1 0 1.5h-4a.75.75 0 0 1-.75-.75Z"
                        clip-rule="evenodd" />
                </svg>



            </div>


            <!-- Nombre del archivo -->
            <h2 class="text-xl font-bold uppercase text-slate-400 mb-3">
                {{ archivo.nombre }}
            </h2>


            <!-- Descripción -->
            <p class="text-sm text-slate-200 mb-4">
                Cantidad de Hojas de Ruta Archivadas
                <br>
                por su oficina
            </p>


            <!-- Cantidad -->
            <div class="bg-red-500 text-white
                 font-bold text-lg
                 rounded-md
                 px-3 py-1
                 mb-5">

                {{ archivo.archivados.length }}

            </div>


            <!-- Botón -->
            <button type="button" class="btn btn-outline btn-info btn-sm gap-2">

                <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" class="w-5 h-5">

                    <path
                        d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-9l-2-2Zm10 14H4V8h16v10Z" />

                </svg>

                Abrir

            </button>

        </div>

        }

    </div>

</div>
